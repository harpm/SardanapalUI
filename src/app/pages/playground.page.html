<h2>Controls</h2>
<s-text-box [formControl]="name" placeholder="Name" />
<s-text-area [formControl]="notes" placeholder="Notes" />
<s-numeric [formControl]="age" [min]="0" [max]="120" placeholder="Age" />
<s-select [formControl]="role" [options]="roles" placeholder="Role" />
<s-date [formControl]="born" placeholder="Born" />
<s-password [formControl]="secret" placeholder="Password" />
<s-checkbox [formControl]="agree" label="I agree" />
<s-switch [formControl]="active" checkedText="On" uncheckedText="Off" />
<p>Name: <s-text [value]="name.value" emptyText="(empty)" /> | Age: <s-text [value]="age.value" emptyText="(empty)" /></p>

<h2>Grid</h2>
<s-grid [client]="people" [columns]="columns" [pageSizeOptions]="[10, 25]" />

<h2>Login</h2>
<p>
  <button nz-button (click)="placeLogin(Placement.Left)">Left</button>
  <button nz-button (click)="placeLogin(Placement.Middle)">Middle</button>
  <button nz-button (click)="placeLogin(Placement.Right)">Right</button>
</p>
@if (loginSession) {
  <p>
    Signed in as {{ loginSession.claims?.id ?? '(no id)' }}, must change password:
    {{ loginSession.mustChangePassword }}
  </p>
}
<div class="login-frame">
  <s-login [placement]="loginPlacement" [background]="loginBg" [role]="1" (loggedIn)="onLoggedIn($event)" />
</div>
<ng-template #loginBg>
  <div class="login-bg"></div>
</ng-template>

<h2>Change password</h2>
<s-change-password (changed)="onLoggedIn($event)" />
