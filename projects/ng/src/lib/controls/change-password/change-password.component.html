@if (userMessage()) {
  <p class="s-change-password-message">{{ userMessage() }}</p>
}
<s-text-box
  class="s-change-password-field"
  [(ngModel)]="model.username"
  [ngModelOptions]="{ standalone: true }"
  [placeholder]="label('username')"
/>
<s-password
  class="s-change-password-field"
  [(ngModel)]="model.oldPassword"
  [ngModelOptions]="{ standalone: true }"
  [placeholder]="label('oldPassword')"
/>
<s-password
  class="s-change-password-field"
  [(ngModel)]="model.newPassword"
  [ngModelOptions]="{ standalone: true }"
  [placeholder]="label('newPassword')"
/>
<s-password
  class="s-change-password-field"
  [(ngModel)]="model.confirmPassword"
  [ngModelOptions]="{ standalone: true }"
  [placeholder]="label('confirmPassword')"
/>
<div class="s-change-password-actions">
  <button
    nz-button
    nzType="primary"
    nzBlock
    type="button"
    [nzLoading]="loading()"
    [disabled]="loading()"
    (click)="submit()"
  >
    {{ label('submit') }}
  </button>
</div>
