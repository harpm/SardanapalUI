<h1>Sardanapal UI demo</h1>
<p>Culture: {{ locale.culture() }}</p>
<p>
  <button nz-button nzType="primary" (click)="useEnglish()">English (ltr)</button>
  <button nz-button (click)="usePersian()">Persian (rtl)</button>
</p>

<nav class="demo-nav">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Playground</a>
  <a routerLink="/login" routerLinkActive="active">Login</a>
  <a routerLink="/change-password" routerLinkActive="active">Change password</a>
  <a routerLink="/secure" routerLinkActive="active">Secure</a>
  <a routerLink="/admin" routerLinkActive="active">Admin</a>
  <a routerLink="/unauthorized" routerLinkActive="active">Unauthorized</a>
</nav>

<p class="demo-session">
  Session: {{ sessionSummary() }}

  <button nz-button nzSize="small" (click)="signInViewer()">Viewer</button>
  <button nz-button nzSize="small" (click)="signInAdmin()">Admin</button>
  <button nz-button nzSize="small" (click)="signInMustChangePassword()">Must change password</button>
  <button nz-button nzSize="small" (click)="signOut()">Sign out</button>
</p>

<router-outlet />
