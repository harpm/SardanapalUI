name: npm

on:
  push:
    branches: ["master"]

permissions:
  contents: read
  packages: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.21.x

      - name: Running Build Script
        run: go run SDBuild.go
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUBTOKEN }}
